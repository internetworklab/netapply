            allowedips:
              - "0.0.0.0/0"
              - "::/0"
            endpoint: "vie1.exploro.one:53906"
        addresses:
          - peer: "10.23.0.4/32"
            local: "10.23.0.1"
          - cidr: "fe80::123/64"
      - name: wg2
        container:
          netns_path: /run/netns/nstest
        peers:
