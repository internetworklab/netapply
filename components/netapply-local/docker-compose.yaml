volumes:
  shared-socks:
    external: true
services:
  netapply-local:
    container_name: netapply-local
    hostname: netapply-local-${NODE_NAME}
    image: ghcr.io/hsiaofongw/netapply:latest
    ipc: host
    pid: host
    network_mode: host
    restart: unless-stopped
    volumes:
      - shared-socks:/shared-socks
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    command:
      - serve-local
      - "--node=${NODE_NAME}"
      - "--bind-unix-socket=/shared-socks/netapply-local.sock"
